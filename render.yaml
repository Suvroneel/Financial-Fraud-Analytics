services:
  - type: web
    name: fraud-detection-app
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn fraud_detection.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
